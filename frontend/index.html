
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatmini AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #10131c;
      color: #f5f7ff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      width: 100%;
      max-width: 760px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    header { text-align: center; padding: 24px 0; }
    header h1 { margin: 0; font-size: 36px; }
    header p { color: #aeb7ce; }
    #chat {
      flex: 1;
      min-height: 280px;
      max-height: 55vh;
      overflow-y: auto;
      border: 1px solid #30384b;
      border-radius: 18px;
      padding: 16px;
      background: #171c29;
    }
    .message {
      margin: 10px 0;
      padding: 12px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { background: #252d40; }
    .user { background: #4056d8; margin-left: 15%; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #384158;
      background: #171c29;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      background: #6578ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    #status { color: #aeb7ce; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🤖 Chatmini</h1>
    <p>Your little AI companion</p>
  </header>
  <section id="chat" aria-live="polite">
    <div class="message bot">Hello! I'm Chatmini. Send me a message to get started.</div>
  </section>
  <form id="form">
    <input id="message" placeholder="Message Chatmini..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
  <div id="status">Starter version · Backend connection will be configured next</div>
</main>
<script>
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const status = document.getElementById("status");

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "message " + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";
    status.textContent = "Chatmini is thinking...";

    try {
      const response = await fetch("https://YOUR-BACKEND-URL/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      if (!response.ok) throw new Error("Backend unavailable");
      const data = await response.json();
      addMessage(data.reply || "I couldn't create a response.", "bot");
      status.textContent = "Connected to Chatmini";
    } catch {
      addMessage(
        "I'm not connected to my server yet. We'll finish setting that up next!",
        "bot"
      );
      status.textContent = "Backend not connected yet";
    }
  });
</script>
</body>
  </html>
